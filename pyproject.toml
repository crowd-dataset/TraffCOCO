[project]
name = "TraffCOCO"
version = "0.1.0"
description = "A modular traffic scene understanding and annotation pipeline for automated TrafficCOCO dataset generation."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Core
    "pyyaml>=6.0",
    "tqdm>=4.67.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.14.0",
    "pandas>=2.2.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0",
    "pycountry>=24.6.0",

    # Deep Learning
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers==4.57.1",
    "accelerate>=1.8",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "protobuf>=5.29",
    "einops>=0.8",
    "timm>=1.0",
    "num2words>=0.5.14",
    "faiss-cpu>=1.8.0",

    # FlashAttention
    #
    # Windows:
    # Prebuilt wheel matching Python 3.12 + PyTorch 2.12 + CUDA 13.0.
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.26/flash_attn-2.8.3%2Bcu130torch2.12-cp312-cp312-win_amd64.whl; sys_platform == 'win32'",

    # Linux:
    # Use the normal Linux package instead of the Windows wheel.
    "flash-attn==2.8.3.post1; sys_platform == 'linux'",

    "bitsandbytes==0.50.0",
    "sentence-transformers>=3.0.0",

    # Plotting / media
    "matplotlib>=3.10.0",
    "librosa>=0.11.0",
    "decord>=0.6.0",
    "lmdb>=2.3.0",
    "peft>=0.20.0",

    # YOLO training
    "ultralytics>=8.4.120",
    "submitit>=1.5.2",
]

[project.optional-dependencies]

dev = [
    "ipykernel>=6.30",
    "jupyter>=1.1",
    "pytest>=8.4",
]

[tool.setuptools.packages.find]
where = ["."]

include = [
    "annotation_pipeline*",
    "src*",
]

# PyTorch CUDA 13.0 wheels
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }