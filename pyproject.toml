
[project]
name = "TraffCOCO"
version = "0.1.0"
description = "A modular traffic scene understanding and annotation pipeline for automated TrafficCOCO dataset generation."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core
    "pyyaml>=6.0",
    "tqdm>=4.67",
    "requests>=2.32",
    "beautifulsoup4>=4.14",
    "pandas>=2.2",
    "opencv-python>=4.10",
    "pillow>=10.0",
    "pycountry>=24.6",
    # Deep Learning
    "torch>=2.6,<3.0",
    "torchvision>=0.21",
    "transformers>=4.52,<5.0",
    "accelerate>=1.8",
    "safetensors>=0.5",
    # Required by many Hugging Face VLMs
    "sentencepiece>=0.2",
    "protobuf>=5.29",
    "einops>=0.8",
    "timm>=1.0",
    "num2words>=0.5.14",
]

[project.optional-dependencies]

dev = [
    "ipykernel>=6.30",
    "jupyter>=1.1",
    "pytest>=8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "annotation_pipeline*",
    "src*",
]

