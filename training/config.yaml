# TraffCOCO YOLO training configuration
#
# Training artifacts/results are written to:
#   outputs/training/
#
# The base model and completed trained models live in:
#   training/
#
# train.py resumes from:
#   outputs/training/train/weights/last.pt
#
# After a successful run:
#   training/weights/best.pt
#   training/weights/last.pt
#
# are updated from the completed training run.

model:
  path: ./training/pretrained/yolo26n.pt

dataset:
  path: ../outputs/YOLO_FORMAT/data.yaml

training:
  epochs: 100
  imgsz: 640
  batch: 16
  workers: 8
  patience: 20
  seed: 42
  device: null

  # train.py uses save_period=1 so last.pt is refreshed every completed
  # epoch. If the process is interrupted, the next run resumes from it.

output:
  project: ../outputs/training
  name: train
  cache: false

resume:
  enabled: true
  checkpoint: ../outputs/training/train/weights/last.pt
  state_file: ../outputs/training/training_state.json
